    <section class="hero">

        <h1>Interactive Periodic Table</h1>

        <p>
            Click elements to learn about them
        </p>

    </section>

    <div class="periodic-table">

        <div class="element" onclick="showElement('Hydrogen','Atomic Number: 1')">
            H
        </div>

        <div class="element" onclick="showElement('Helium','Atomic Number: 2')">
            He
        </div>

        <div class="element" onclick="showElement('Lithium','Atomic Number: 3')">
            Li
        </div>

        <div class="element" onclick="showElement('Carbon','Atomic Number: 6')">
            C
        </div>

        <div class="element" onclick="showElement('Nitrogen','Atomic Number: 7')">
            N
        </div>

        <div class="element" onclick="showElement('Oxygen','Atomic Number: 8')">
            O
        </div>

        <div class="element" onclick="showElement('Sodium','Atomic Number: 11')">
            Na
        </div>

        <div class="element" onclick="showElement('Chlorine','Atomic Number: 17')">
            Cl
        </div>

    </div>

    <div class="info-box">

        <h2 id="elementName">
            Click an Element
        </h2>

        <p id="elementInfo"></p>

    </div>
